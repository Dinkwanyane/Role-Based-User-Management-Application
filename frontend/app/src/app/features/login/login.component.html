<div class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center p-4">
  <form (ngSubmit)="onSubmit()" class="w-full max-w-sm bg-white/95 backdrop-blur-lg rounded-2xl shadow-2xl p-8 border border-white/50">

    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">Login</h1>
      <p class="text-sm text-gray-500 mt-1">Sign in to your account.</p>
    </div>

    <div class="mb-5">
      <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
      <input
        type="text"
        name="username"
        [(ngModel)]="username"
        placeholder="Enter username"
        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder:text-gray-400"
        required
      />
    </div>

    <div class="mb-5">
      <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="••••••••"
        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder:text-gray-400"
        required
      />
    </div>

    <p *ngIf="errorMessage" class="mb-5 p-3 bg-rose-50 border-l-4 border-rose-500 rounded-r-lg text-rose-800 text-sm font-medium">
      {{ errorMessage }}
    </p>

    <button
      type="submit"
      class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-200 transition-all duration-200 hover:shadow-indigo-300 cursor-pointer"
    >
      Login
    </button>
  </form>
</div>
