<div class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 p-4 sm:p-6 flex flex-col justify-between">
  
  <!-- Navigation Header (Separated Home and Logout using flex & justify-between) -->
  <header class="max-w-4xl w-full mx-auto flex justify-between items-center bg-white/10 backdrop-blur-md px-6 py-3 rounded-xl border border-white/20 shadow-lg mb-6">
    <button
      type="button"
      (click)="goHome()"
      class="inline-flex items-center gap-2 px-4 py-2 bg-white/20 hover:bg-white/30 text-white text-sm font-semibold rounded-lg backdrop-blur-sm transition-all duration-200 hover:scale-105 active:scale-95 cursor-pointer"
    >
      <span>←</span> Home
    </button>
    
    <button
      type="button"
      (click)="logout()"
      class="px-4 py-2 bg-red-500/80 hover:bg-red-600 text-white text-sm font-semibold rounded-lg shadow-md transition-all duration-200 hover:scale-105 active:scale-95 cursor-pointer"
    >
      Logout
    </button>
  </header>

  <!-- Main Card Container -->
  <main class="flex-grow flex items-center justify-center">
    <div class="w-full max-w-lg bg-white/95 backdrop-blur-lg rounded-2xl shadow-2xl p-8 border border-white/50">
      
      <div class="text-center mb-6">
        <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">Create User</h1>
        <p class="text-sm text-gray-500 mt-1">Add a new user account to the platform.</p>
      </div>

      <!-- Success Alert -->
      <div *ngIf="successMessage" class="mb-5 p-4 bg-emerald-50 border-l-4 border-emerald-500 rounded-r-lg text-emerald-800 text-sm font-medium shadow-sm">
        {{ successMessage }}
      </div>

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="mb-5 p-4 bg-rose-50 border-l-4 border-rose-500 rounded-r-lg text-rose-800 text-sm font-medium shadow-sm">
        {{ errorMessage }}
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
        
        <!-- Name -->
        <div>
          <label for="name" class="block text-sm font-semibold text-gray-700 mb-1">First Name</label>
          <input
            id="name"
            type="text"
            formControlName="name"
            placeholder="Enter first name"
            class="w-full px-4 py-2.5 bg-gray-50 border rounded-xl text-gray-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder:text-gray-400"
            [ngClass]="{ 'border-rose-400 bg-rose-50/30': f['name'].touched && f['name'].invalid, 'border-gray-200': !(f['name'].touched && f['name'].invalid) }"
          />
          <p *ngIf="f['name'].touched && f['name'].invalid" class="text-xs text-rose-500 font-medium mt-1">First name is required (min 2 characters).</p>
        </div>

        <!-- Surname -->
        <div>
          <label for="surname" class="block text-sm font-semibold text-gray-700 mb-1">Surname</label>
          <input
            id="surname"
            type="text"
            formControlName="surname"
            placeholder="Enter surname"
            class="w-full px-4 py-2.5 bg-gray-50 border rounded-xl text-gray-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder:text-gray-400"
            [ngClass]="{ 'border-rose-400 bg-rose-50/30': f['surname'].touched && f['surname'].invalid, 'border-gray-200': !(f['surname'].touched && f['surname'].invalid) }"
          />
          <p *ngIf="f['surname'].touched && f['surname'].invalid" class="text-xs text-rose-500 font-medium mt-1">Surname is required (min 2 characters).</p>
        </div>

        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
          <input
            id="username"
            type="text"
            formControlName="username"
            placeholder="Enter username"
            class="w-full px-4 py-2.5 bg-gray-50 border rounded-xl text-gray-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder:text-gray-400"
            [ngClass]="{ 'border-rose-400 bg-rose-50/30': f['username'].touched && f['username'].invalid, 'border-gray-200': !(f['username'].touched && f['username'].invalid) }"
          />
          <p *ngIf="f['username'].touched && f['username'].invalid" class="text-xs text-rose-500 font-medium mt-1">Username is required (min 3 characters).</p>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••••"
            class="w-full px-4 py-2.5 bg-gray-50 border rounded-xl text-gray-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder:text-gray-400"
            [ngClass]="{ 'border-rose-400 bg-rose-50/30': f['password'].touched && f['password'].invalid, 'border-gray-200': !(f['password'].touched && f['password'].invalid) }"
          />
          <p *ngIf="f['password'].touched && f['password'].invalid" class="text-xs text-rose-500 font-medium mt-1">Password must be at least 8 characters.</p>
        </div>

        <!-- Submit Button -->
        <div class="pt-3">
          <button
            type="submit"
            [disabled]="submitting"
            class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-200 transition-all duration-200 hover:shadow-indigo-300 disabled:opacity-50 cursor-pointer"
          >
            {{ submitting ? 'Saving User...' : 'Save User' }}
          </button>
        </div>

      </form>
    </div>
  </main>


</div>
